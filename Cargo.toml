[package]
name = "expresskit-packager"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "packager"
path = "packager/index.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
inquire = "0.7"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
tokio = { version = "1.37", features = ["full"] }
